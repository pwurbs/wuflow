<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wuFlow — Login</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="stylesheet" href="styles/abstracts/variables.css">
  <link rel="stylesheet" href="styles/base/reset.css">
  <link rel="stylesheet" href="styles/base/typography.css">
  <link rel="stylesheet" href="styles/pages/login.css">
</head>

<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <img src="logo.png" alt="wuFlow Logo" class="login-logo">
        <h1>wuFlow</h1>
      </div>

      <form id="login-form" autocomplete="on">
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" name="email" placeholder="you@example.com" required autocomplete="email"
            pattern="[^\s@]+@[^\s@]+" title="Email address (e.g. user@domain)" autofocus>
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" name="password" placeholder="Enter your password" required
            autocomplete="current-password">
        </div>
        <div id="login-error" class="login-error hidden" role="alert"></div>
        <button type="submit" id="login-btn" class="login-btn">Sign in</button>
      </form>
    </div>
  </div>

  <script src="js/login.js"></script>
</body>

</html>
