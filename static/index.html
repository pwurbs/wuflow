<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WuTrak</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <header>
            <div class="header-left">
                <h1 style="display: flex; align-items: center; gap: 12px;">
                    <img src="logo.png" alt="WuTrak Logo" style="height: 48px;">
                    <span style="font-weight: 500; color: #003d99;">WuTrak</span>
                </h1>
                <button id="add-issue-btn" class="btn primary">+ New Issue</button>
            </div>
            <nav class="nav-links">
                <button id="nav-backlog" class="btn toggle-btn">Backlog</button>
                <button id="nav-board" class="btn toggle-btn active">Board</button>
            </nav>
            <div class="header-controls">
                <div class="view-toggles">
                    <button id="btn-deadlines" class="btn toggle-btn active">Deadlines</button>
                    <button id="btn-planning" class="btn toggle-btn">Planning</button>
                </div>
            </div>
        </header>

        <div class="main-content">
            <div class="board">
                <div class="column" data-status="Todo">
                    <div class="column-header">
                        <h2>Todo</h2>
                        <span class="count">0</span>
                    </div>
                    <div class="column-content" id="col-todo">
                        <!-- Issues will be injected here -->
                    </div>
                </div>

                <div class="column" data-status="Pending">
                    <div class="column-header">
                        <h2>Pending</h2>
                        <span class="count">0</span>
                    </div>
                    <div class="column-content" id="col-pending"></div>
                </div>

                <div class="column" data-status="Working">
                    <div class="column-header">
                        <h2>Working</h2>
                        <span class="count">0</span>
                    </div>
                    <div class="column-content" id="col-working"></div>
                </div>

                <div class="column" data-status="Done">
                    <div class="column-header">
                        <h2>Done</h2>
                        <span class="count">0</span>
                    </div>
                    <div class="column-content" id="col-done"></div>
                </div>
            </div>

            <div id="backlog-view" class="hidden">
                <div class="backlog-header" style="margin-bottom: 4px;">
                    <h2>MOVE TO BOARD</h2>
                </div>
                <div class="backlog-list" id="move-to-todo-list" style="margin-bottom: 24px;">
                </div>
                <div class="backlog-header">
                    <h2>Backlog</h2>
                    <span class="count" id="backlog-count">0</span>
                </div>
                <div class="backlog-list" id="backlog-list">
                    <!-- Backlog issues will be injected here -->
                </div>
            </div>

            <aside class="sidebar">
                <div id="deadlines-panel">
                    <div class="sidebar-header">
                        <h3>Upcoming Deadlines</h3>
                        <span class="count" id="deadline-count">0</span>
                    </div>
                    <ul id="deadline-list"></ul>
                </div>
                <div id="planning-panel" class="hidden">
                    <div class="sidebar-header">
                        <h3>Planning</h3>
                    </div>
                    <div id="planning-list">
                        <!-- Planning days will be injected here -->
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <!-- Modal for New/Edit Issue -->
    <div id="issue-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2 id="modal-title">New Issue</h2>
            <form id="issue-form">
                <input type="hidden" id="issue-id">
                <div class="form-group">
                    <label for="status">Status</label>
                    <select id="status">
                        <option value="Open">Open</option>
                        <option value="Todo">Todo</option>
                        <option value="Pending">Pending</option>
                        <option value="Working">Working</option>
                        <option value="Done">Done</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="title">Title</label>
                    <input type="text" id="title" required>
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" rows="4"></textarea>
                </div>
                <div class="form-group">
                    <label for="planned-date">Planned Date</label>
                    <input type="date" id="planned-date">
                </div>
                <div class="form-group">
                    <label for="deadline">Deadline</label>
                    <input type="datetime-local" id="deadline">
                </div>
                <div class="form-actions">
                    <button type="button" id="delete-issue-btn" class="btn danger hidden">Delete Issue</button>
                    <button type="submit" class="btn primary">Save</button>
                </div>
            </form>

            <div id="tasks-section" class="hidden">
                <h3>Tasks</h3>
                <ul id="task-list"></ul>
                <form id="task-form">
                    <div class="input-group">
                        <input type="text" id="new-task-title" placeholder="Add a task..." required>
                        <input type="datetime-local" id="new-task-deadline" title="Task Deadline">
                        <button type="submit" class="btn secondary">Add</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirm-modal" class="modal hidden">
        <div class="modal-content confirm">
            <h2 id="confirm-title" style="margin-bottom: 12px;">Confirm Action</h2>
            <p id="confirm-message" style="margin-bottom: 24px; color: #5e6c84;">Are you sure?</p>
            <div class="form-actions" style="justify-content: flex-end;">
                <button id="confirm-cancel-btn" class="btn secondary">Cancel</button>
                <button id="confirm-ok-btn" class="btn danger">Delete</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
