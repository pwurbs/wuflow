# Debug manifest — deploys traefik/whoami to inspect headers forwarded by Traefik.
# It mirrors the same ingress setup as wuFlow so the headers are identical.
#
# Usage:
#   kubectl apply  -f deploy/debug-headers.yaml --kubeconfig ~/.kube/wuflow-dev.yaml -n wuflow
#   kubectl delete -f deploy/debug-headers.yaml --kubeconfig ~/.kube/wuflow-dev.yaml -n wuflow
#
# Then either:
#   curl https://<host>          → headers echoed in the response body
#   kubectl logs -n wuflow deploy/wuflow-debug --kubeconfig ~/.kube/wuflow-dev.yaml

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wuflow-debug
  namespace: wuflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wuflow-debug
  template:
    metadata:
      labels:
        app: wuflow-debug
    spec:
      automountServiceAccountToken: false
      containers:
        - name: whoami
          image: traefik/whoami:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: wuflow-debug
  namespace: wuflow
spec:
  selector:
    app: wuflow-debug
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wuflow-debug
  namespace: wuflow
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - wuflow.pwurbs.dev   # adapt if needed
  rules:
    - host: wuflow.pwurbs.dev   # adapt if needed
      http:
        paths:
          - path: /debug
            pathType: Prefix
            backend:
              service:
                name: wuflow-debug
                port:
                  number: 80
