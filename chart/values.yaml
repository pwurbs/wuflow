image:
  repository: ghcr.io/pwurbs/wuflow
  tag: ""   # defaults to the chart's appVersion; override only to test a different image tag
  pullPolicy: IfNotPresent

wuflow:
  port: 8080
  logLevel: info
  secureCookie: true
  apiRateLimit: true
  remoteIpHeader: "X-Forwarded-For"
  initialAdminEmail: admin@local

secrets:
  # existingSecret: if set, name of an already existing Secret, for setups where the
  # Secret is created and managed outside of this chart from the start (e.g. SOPS, External
  # Secrets Operator). If left empty, the chart generates the initial admin password and the
  # secret key itself on first install, so no cleartext secret ever needs to be set as a value,
  # and keeps reusing the live values (verbatim, still base64, never decoded) on every
  # subsequent render, so changing them directly in the cluster is safe. If a Flux HelmRelease
  # drives this chart with driftDetection enabled, add an `ignore` rule for this Secret's
  # `/data` path (see README > Secrets), so Flux doesn't revert a manual change.
  existingSecret: ""
  # Key names inside the Secret. Only relevant when existingSecret is set, in case it doesn't
  # use the chart's own default key names.
  existingSecretKeys:
    initialAdminPassword: ""  # default: initial-admin-password
    secretKey: ""             # default: secret-key

ingress:
  host: ""        # e.g. wuflow.example.com — set in values.{env}.yaml
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  tls:
    enabled: true
    secretName: ""  # empty = Traefik default cert; set for cert-manager
  # true creates a Traefik "compress" Middleware and attaches it to the ingress router, so
  # responses are sent compressed. Makes the app considerably
  # faster on slow connections. Requires Traefik's Kubernetes CRDs (traefik.io/v1alpha1, as
  # installed by k3s and the Traefik Helm chart) and className "traefik"; helm fails otherwise.
  # Not needed behind a CDN that compresses.
  compress: false

storage:
  storageClass: local-path   # set to your cluster's storage class (e.g. standard, longhorn)
  data:
    size: 1Gi

# false runs the pod in its own Linux user namespace: UID 999 inside the container maps to an
# unprivileged, pod-unique UID on the node, which limits the impact of a container escape.
# Requires node support (Kubernetes 1.33+, Linux kernel 6.3+, containerd 2.x or CRI-O, runc 1.2+
# or crun, a filesystem with idmapped mount support for the data volume). Pods fail to start on
# nodes without it, so it's opt-in.
hostUsers: true

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    memory: 256Mi
