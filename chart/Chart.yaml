apiVersion: v2
name: wuflow
description: wuFlow is a modern and lightweight issue tracking and planning application.
type: application
version: 1.4.4
appVersion: "1.4.4"
icon: https://raw.githubusercontent.com/pwurbs/wuflow/main/static/logo.png
home: https://wuflow.dev
sources:
  - https://github.com/pwurbs/wuflow
maintainers:
  - name: pwurbs
    url: https://pwurbs.github.io
keywords:
  - kanban
  - agile
  - issue-tracking
  - jira-alternative
  - self-hosted
  - open-source
  - release-management
  - backlog-management
annotations:
  artifacthub.io/category: skip-prediction
  artifacthub.io/changes: |
    - kind: changed
      description: wuFlow 1.4.4
      links:
        - name: Release notes
          url: https://github.com/pwurbs/wuflow/releases/tag/v1.4.4
    - kind: security
      description: The client IP header (wuflow.remoteIpHeader) is used only from trusted proxies; entries forged by clients are ignored
    - kind: added
      description: Optional value wuflow.trustedProxies (default empty = wuFlow's default, loopback and private ranges)
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/links: |
    - name: Website
      url: https://wuflow.dev
    - name: Documentation
      url: https://github.com/pwurbs/wuflow/wiki
    - name: Support
      url: https://github.com/pwurbs/wuflow/issues
  artifacthub.io/images: |
    - name: wuflow
      image: ghcr.io/pwurbs/wuflow:1.4.4
  artifacthub.io/screenshots: |
    - title: Board
      url: https://raw.githubusercontent.com/pwurbs/wuflow/main/docs/screenshots/board.png
    - title: Issue
      url: https://raw.githubusercontent.com/pwurbs/wuflow/main/docs/screenshots/issue.png
    - title: Backlog
      url: https://raw.githubusercontent.com/pwurbs/wuflow/main/docs/screenshots/backlog.png
    - title: Releases
      url: https://raw.githubusercontent.com/pwurbs/wuflow/main/docs/screenshots/releases.png
