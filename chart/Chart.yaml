apiVersion: v2
name: wuflow
description: "wuFlow is a lean, security-first, self-hosted issue tracker: Kanban board, backlog, releases and a daily planner in one place."
type: application
version: 1.4.7
appVersion: "1.4.6"
icon: https://raw.githubusercontent.com/pwurbs/wuflow/main/static/logo.png
home: https://wuflow.dev
sources:
  - https://github.com/pwurbs/wuflow
maintainers:
  - name: pwurbs
    url: https://pwurbs.github.io
keywords:
  - kanban
  - agile
  - issue-tracker
  - project-management
  - jira-alternative
  - self-hosted
  - open-source
  - release-management
  - backlog-management
annotations:
  artifacthub.io/category: skip-prediction
  artifacthub.io/changes: |
    - kind: fixed
      description: The pod failing to write to a new volume that belongs to root, such as cloud block storage, the pod now sets fsGroup. On existing installations, the first start after the upgrade changes the group of all files on the volume once
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/links: |
    - name: Website
      url: https://wuflow.dev
    - name: Documentation
      url: https://github.com/pwurbs/wuflow#documentation
    - name: Support
      url: https://github.com/pwurbs/wuflow/issues
  artifacthub.io/images: |
    - name: wuflow
      image: ghcr.io/pwurbs/wuflow:1.4.6
  artifacthub.io/screenshots: |
    - title: Board
      url: https://raw.githubusercontent.com/pwurbs/wuflow/main/docs/screenshots/board.png
    - title: Issue
      url: https://raw.githubusercontent.com/pwurbs/wuflow/main/docs/screenshots/issue.png
    - title: Backlog
      url: https://raw.githubusercontent.com/pwurbs/wuflow/main/docs/screenshots/backlog.png
    - title: Releases
      url: https://raw.githubusercontent.com/pwurbs/wuflow/main/docs/screenshots/releases.png
