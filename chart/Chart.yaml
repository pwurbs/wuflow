apiVersion: v2
name: wuflow
description: wuFlow is a modern and lightweight issue tracking and planning application.
type: application
version: 1.4.2-pre2
appVersion: "1.4.2-pre2"
icon: https://raw.githubusercontent.com/pwurbs/wuflow/main/static/logo.png
home: https://github.com/pwurbs/wuflow
sources:
  - https://github.com/pwurbs/wuflow
maintainers:
  - name: pwurbs
    url: https://pwurbs.github.io
keywords:
  - kanban
  - agile
  - issue-tracking
  - jira-alternative
  - self-hosted
  - open-source
  - release-management
  - backlog-management
annotations:
  artifacthub.io/category: skip-prediction
  artifacthub.io/changes: |
    - kind: added
      description: Added defaults and descriptions to the values schema for Artifact Hub's parameter docs
    - kind: changed
      description: ingress.host is now required and must be set explicitly
    - kind: fixed
      description: Disabled Artifact Hub's automatic category prediction, which had misclassified the chart as monitoring-logging
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/links: |
    - name: Documentation
      url: https://github.com/pwurbs/wuflow/wiki
    - name: Support
      url: https://github.com/pwurbs/wuflow/issues
  artifacthub.io/images: |
    - name: wuflow
      image: ghcr.io/pwurbs/wuflow:1.4.1
  artifacthub.io/screenshots: |
    - title: Board
      url: https://raw.githubusercontent.com/pwurbs/wuflow/main/docs/screenshots/board.png
    - title: Issue
      url: https://raw.githubusercontent.com/pwurbs/wuflow/main/docs/screenshots/issue.png
    - title: Backlog
      url: https://raw.githubusercontent.com/pwurbs/wuflow/main/docs/screenshots/backlog.png
    - title: Releases
      url: https://raw.githubusercontent.com/pwurbs/wuflow/main/docs/screenshots/releases.png
