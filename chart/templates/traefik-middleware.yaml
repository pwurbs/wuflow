{{- if .Values.ingress.compress }}
# Traefik compress middleware, attached to the ingress router in ingress.yaml.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Release.Name }}-compress
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
    {{- include "wuflow.labels" . | nindent 4 }}
spec:
  compress: {}
{{- end }}
