{{- include "wuflow.validateSecrets" . }}
{{- if not .Values.secrets.existingSecret }}
{{- $secretName := include "wuflow.secretName" . }}
{{- $lengths := dict (include "wuflow.secretKeyInitialAdminPassword" .) 20 (include "wuflow.secretKeySecretKey" .) 40 }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $existingData := dict }}
{{- if $existing }}{{- $existingData = $existing.data | default dict }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  # Only protects this Secret from `helm uninstall`
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  # Existing values are carried through byte-for-byte from the live Secret — so as long as nothing actually
  # rotated the values out of band, this renders identically to the live object on every
  # reconcile, and there's nothing for Flux's drift detection to fight over.
  #
  # If the Secret already exists but is missing one of these keys, we refuse to mint a
  # replacement rather than silently generating a new, mismatched value.
{{- range $key, $length := $lengths }}
  {{- if and $existing (not (hasKey $existingData $key)) }}
    {{- fail (printf "Secret %s exists but is missing key %q. Refusing to generate a replacement." $secretName $key) }}
  {{- end }}
  {{ $key }}: {{ get $existingData $key | default (randAlphaNum (int $length) | b64enc) | quote }}
{{- end }}
{{- end }}
