{{- $secretName := printf "%s-secrets" .Release.Name }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $adminPassword := .Values.secrets.initialAdminPassword }}
{{- if not $adminPassword }}
  {{- if $existing }}
    {{- $adminPassword = index $existing.data "initial-admin-password" | b64dec }}
  {{- else }}
    {{- $adminPassword = randAlphaNum 20 }}
  {{- end }}
{{- end }}
{{- $secretKey := .Values.secrets.secretKey }}
{{- if not $secretKey }}
  {{- if $existing }}
    {{- $secretKey = index $existing.data "secret-key" | b64dec }}
  {{- else }}
    {{- $secretKey = randAlphaNum 40 }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  initial-admin-password: {{ $adminPassword | quote }}
  secret-key: {{ $secretKey | quote }}
