{{- include "wuflow.validateIngress" . }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  {{- $annotations := deepCopy (.Values.ingress.annotations | default dict) }}
  {{- if .Values.ingress.compress }}
  {{- /* Append the compress middleware to middlewares the deployer may already have set. */}}
  {{- $key := "traefik.ingress.kubernetes.io/router.middlewares" }}
  {{- $middleware := printf "%s-%s-compress@kubernetescrd" .Release.Namespace .Release.Name }}
  {{- $existing := get $annotations $key }}
  {{- $_ := set $annotations $key (ternary (printf "%s,%s" $existing $middleware) $middleware (ne $existing "")) }}
  {{- end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if and .Values.ingress.tls.enabled .Values.ingress.tls.secretName }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- else if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}
                port:
                  number: {{ .Values.wuflow.port }}
