# This tells the scanner: "Send the results to the Cloud, not Localhost"
sonar.host.url=https://sonarcloud.io

# Uniquely identifies your project on SonarCloud
# You get these from the project Information page on SonarCloud
sonar.organization=pwurbs-oss
sonar.projectKey=wuflow-oss

# Source code location. 
# "." means "everything in this directory"
# we exclude some files and folders later
sonar.sources=.

# Exclusions (Optional)
# Don't scan build results, database files
sonar.exclusions=bin/**,static/dist/**,*.db*,docs/screenshots/**,**/*.png,**/*.jpg,**/*.jpeg,**/*.gif,**/*.ico,**/*.svg

# Specify test files
sonar.tests=.
sonar.test.inclusions=**/*_test.go,static/js/tests/**/*.ts,playwright/**/*.spec.ts,scripts/**/*.mjs

# Test coverage report
sonar.go.coverage.reportPaths=backend/test-results/coverage.out
sonar.javascript.lcov.reportPaths=static/js/coverage/lcov.info
sonar.coverage.inclusions=backend/**/*.go,static/js/**/*.ts
# the inclusion is not sufficient to exclude static files, so we need to exclude them explicitly
sonar.coverage.exclusions=main.go,\\\
                          scripts/**,\\\
                          playwright/**,\\\
                          static/**/*.css,\\\
                          static/**/*.html,\\\
                          static/js/tests/**,\\\
                          static/js/node_modules/**,\\\
                          static/js/vite.config.ts,\\\
                          static/js/vitest.config.ts,\\\
                          static/js/app.ts,\\\
                          static/js/login.ts,\\\
                          static/js/list-utils.ts,\\\
                          static/js/validation-config.ts,\\\
                          static/js/domain-constants.ts,\\\
                          static/js/components/card.ts

# include gosec report, gosec must be executed before
sonar.externalIssuesReportPaths=backend/test-results/gosec-report.json
